# Dedicated low-power smoke profile. Keep console traffic out of the idle
# interval so the only expected wake source is the Zephyr CLINT timeout.
CONFIG_TICKLESS_KERNEL=y
CONFIG_ERISCV_MCU_WFI_CLOCK_GATING=y
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_UART_CONSOLE=n
CONFIG_ERISCV_UART_IRQ_CONSOLE=n
CONFIG_MAIN_STACK_SIZE=1024
