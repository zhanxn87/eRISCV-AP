%YAML 1.2
---
$id: http://devicetree.org/schemas/net/eriscv,ap-ethernet.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: eRISCV-AP Ethernet MAC and descriptor-ring DMA

maintainers:
  - Xianning Zhan <zhanxn87@163.com>

allOf:
  - $ref: ethernet-controller.yaml#

properties:
  compatible:
    const: eriscv,ap-ethernet-1.0

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  local-mac-address: true

required:
  - compatible
  - reg
  - interrupts

additionalProperties: true

examples:
  - |
    ethernet@10005000 {
        compatible = "eriscv,ap-ethernet-1.0";
        reg = <0x0 0x10005000 0x0 0x1000>;
        interrupts = <5>;
        local-mac-address = [02 00 00 00 00 01];
    };
...
